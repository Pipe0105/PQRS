version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: pqrs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pqrs
    ports:
      - "3306:3306"
    volumes:
      - pqrs_mysqldata:/var/lib/mysql

volumes:
  pqrs_mysqldata:

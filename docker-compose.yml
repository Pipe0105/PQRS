version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: pqrs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pqrs
    ports:
      - "5432:5432"
    volumes:
      - pqrs_pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-12-13T00-10-36Z
    container_name: pqrs-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pqrs_minio:/data

volumes:
  pqrs_pgdata:
  pqrs_minio:
